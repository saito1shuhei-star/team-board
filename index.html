<title>Design Control — 設計管制盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --ground:#EEF1F3; --surface:#FFFFFF; --sunk:#E3E8EB; --ink:#13171B; --ink-2:#3C4750;
  --muted:#6C7883; --rule:#D6DCE1; --rule-2:#BCC5CC;
  --fixed:#136B57; --fixed-bg:#E1F0EB;
  --active:#2B4A63; --active-bg:#E6EDF2;
  --prov:#8A6100;  --prov-bg:#FAF2DD;
  --stall:#BE3428; --stall-bg:#FAEBE9;
  --warnline:#E3CE92;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1215; --surface:#161B20; --sunk:#1D242A; --ink:#E6EBEE; --ink-2:#B1BCC4;
  --muted:#85919A; --rule:#293238; --rule-2:#3A464E;
  --fixed:#5CC0A5; --fixed-bg:#112421;
  --active:#9DBBD4; --active-bg:#15212B;
  --prov:#D5A63C;  --prov-bg:#292211;
  --stall:#F0705F; --stall-bg:#2B1816;
  --warnline:#4C3D18;
}}
:root[data-theme="dark"]{
  --ground:#0E1215; --surface:#161B20; --sunk:#1D242A; --ink:#E6EBEE; --ink-2:#B1BCC4;
  --muted:#85919A; --rule:#293238; --rule-2:#3A464E;
  --fixed:#5CC0A5; --fixed-bg:#112421;
  --active:#9DBBD4; --active-bg:#15212B;
  --prov:#D5A63C;  --prov-bg:#292211;
  --stall:#F0705F; --stall-bg:#2B1816;
  --warnline:#4C3D18;
}
.demo-note{background:var(--prov-bg);border:1px solid var(--warnline);color:var(--prov);border-radius:4px;padding:8px 12px;margin-top:10px;font-size:12px;}
.demo-note a{color:inherit;}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px;}

header{padding:14px 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.03em;}
.sub{color:var(--muted);font-size:12px;}
.sp{flex:1 1 auto;}
input[type=date]{font-family:"Roboto Mono",monospace;font-size:13px;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:3px;padding:4px 7px;}
button{font-family:inherit;font-size:12.5px;font-weight:500;background:var(--ink);color:var(--surface);
  border:none;border-radius:3px;padding:5px 11px;cursor:pointer;}
button.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule-2);}
button:hover{opacity:.86;}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--active);outline-offset:2px;}
.pollstat{font-size:11.5px;font-family:"Roboto Mono",monospace;color:var(--muted);white-space:nowrap;}
.pollstat.live{color:var(--fixed);font-weight:700;} .pollstat.off{color:var(--prov);}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:8px;margin-top:12px;}
.tile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--rule-2);
  border-radius:4px;padding:8px 11px;cursor:pointer;}
.tile[data-on="1"]{outline:2px solid var(--ink);outline-offset:-1px;}
.tile.t-fixed{border-top-color:var(--fixed);} .tile.t-active{border-top-color:var(--active);}
.tile.t-prov{border-top-color:var(--prov);} .tile.t-stall{border-top-color:var(--stall);}
.tile.t-blk{border-top-color:var(--stall);background:var(--stall-bg);}
.tile dt{font-size:11px;color:var(--muted);}
.tile dd{margin:0;font-family:"Roboto Mono",monospace;font-size:24px;font-weight:700;line-height:1.1;}
.tile.t-fixed dd{color:var(--fixed);} .tile.t-active dd{color:var(--active);}
.tile.t-prov dd{color:var(--prov);} .tile.t-stall dd,.tile.t-blk dd{color:var(--stall);}
.tile dd small{font-size:11.5px;font-weight:500;margin-left:2px;color:var(--muted);}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:12px;margin-top:12px;align-items:start;}
@media (max-width:1000px){.cols{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;}
.card-h{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--rule);flex-wrap:wrap;}
.card-h h2{font-size:13px;font-weight:700;margin:0;letter-spacing:.06em;}
.card-b{padding:12px 13px;}
.tabs{display:flex;gap:5px;}
.tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:3px 10px;font-size:12.5px;}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface);}
.scrollx{overflow-x:auto;}
svg{display:block;height:auto;}

/* graph */
.g-node{cursor:pointer;}
.g-node:hover rect{filter:brightness(1.04);}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:9px 13px 0;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}

/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule);vertical-align:top;}
th{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.05em;background:var(--sunk);position:sticky;top:0;}
tr{cursor:pointer;} tr:hover td{background:var(--sunk);}
tr[data-sel="1"] td{background:var(--sunk);box-shadow:inset 3px 0 0 var(--ink);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;}
.b-fixed{background:var(--fixed-bg);color:var(--fixed);} .b-active{background:var(--active-bg);color:var(--active);}
.b-prov{background:var(--prov-bg);color:var(--prov);} .b-stall{background:var(--stall-bg);color:var(--stall);}
.stale{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;
  background:var(--stall-bg);color:var(--stall);border:1px solid var(--stall);margin-left:5px;}

/* history */
.hist{display:flex;flex-direction:column;gap:9px;}
.hist-i{border-left:2px solid var(--rule-2);padding:0 0 0 12px;}
.hist-i b{font-size:13px;} .hist-d{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--muted);}
.hist-x{font-size:12px;color:var(--ink-2);}

/* side */
.side{position:sticky;top:10px;display:flex;flex-direction:column;gap:10px;}
.sel-h{padding:11px 13px;border-bottom:1px solid var(--rule);}
.sel-grp{font-size:11px;color:var(--muted);}
.sel-n{font-size:16px;font-weight:700;line-height:1.4;}
.sel-v{font-family:"Roboto Mono",monospace;font-size:13px;color:var(--ink-2);margin-top:3px;}
.kv{font-size:12.5px;}
.kv dt{font-size:10.5px;color:var(--muted);letter-spacing:.05em;margin-top:10px;}
.kv dt:first-child{margin-top:0;}
.kv dd{margin:2px 0 0;color:var(--ink-2);}
.rev{background:var(--prov-bg);border:1px solid var(--warnline);border-radius:3px;padding:8px 10px;font-size:12px;color:var(--prov);}
.quote{background:var(--sunk);border-radius:3px;padding:8px 10px;font-size:12px;color:var(--ink-2);}
.quote cite{display:block;font-style:normal;font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--muted);margin-bottom:3px;}
.chain{display:flex;flex-direction:column;gap:5px;}
.chain a{display:flex;gap:8px;align-items:center;font-size:12.5px;color:inherit;text-decoration:none;
  background:var(--sunk);border-radius:3px;padding:5px 9px;cursor:pointer;}
.chain a:hover{outline:1px solid var(--rule-2);}
.chain .g{color:var(--muted);font-size:11px;}
.none{font-size:12px;color:var(--muted);}

/* tasks */
.dcard{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--fixed);
  border-radius:3px;padding:9px 12px;margin-bottom:6px;}
.dtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.dtop h3{font-size:13px;font-weight:700;margin:0;flex:1 1 180px;}
.gb{font-size:10.5px;font-weight:700;background:var(--fixed-bg);color:var(--fixed);padding:1px 7px;border-radius:3px;}
.why{font-size:11.5px;color:var(--muted);margin-top:2px;}
.dbody{background:var(--sunk);border-radius:3px;padding:9px 11px;margin-top:6px;font-size:12.5px;
  color:var(--ink-2);white-space:pre-wrap;line-height:1.75;}
.dcard details>summary{cursor:pointer;font-size:11.5px;color:var(--active);margin-top:6px;}
.ok{font-size:11px;color:var(--fixed);font-weight:600;}

footer{margin-top:22px;padding-top:11px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted);
  display:flex;gap:14px;flex-wrap:wrap;}
@media (max-width:600px){h1{font-size:16px;} .tile dd{font-size:20px;}}
</style>

<div class="wrap">

<header>
  <h1>Design Control</h1>
  <span class="sub">チャットの報告から設計値の依存を追う</span>
  <span class="sp"></span>
  <input type="date" id="base" value="2026-08-26" aria-label="基準日">
  <button class="ghost" id="today">今日</button>
  <span class="pollstat" id="pollStat">—</span>
</header>

<p class="demo-note"><b>これはサンプルデータのデモです。</b>架空のチームを想定した数値・発言に置き換えてあります。実在の団体・個人の情報は含みません。使い方は <a href="https://github.com/saito1shuhei-star/team-board#readme">README</a> を。</p>

<dl class="tiles" id="tiles"></dl>

<div class="cols">
  <div>
    <div class="card">
      <div class="card-h">
        <h2>DESIGN ELEMENTS</h2>
        <span class="sub" id="cnt"></span>
        <span class="sp"></span>
        <div class="tabs" role="tablist">
          <button role="tab" data-v="dep" aria-selected="true">依存関係</button>
          <button role="tab" data-v="list" aria-selected="false">一覧</button>
          <button role="tab" data-v="hist" aria-selected="false">変更履歴</button>
          <button role="tab" data-v="task" aria-selected="false">振れる仕事</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card-b scrollx" id="view"></div>
    </div>
  </div>

  <div class="side">
    <div class="card" id="sel"></div>
  </div>
</div>

<footer>
  <span>進捗率（%）は算出していません。</span>
  <span>値の再計算はしません。影響範囲の列挙までです。</span>
  <span>役職表記のみ・個人名なし。</span>
  <span><a href="https://github.com/saito1shuhei-star/team-board" style="color:var(--active)">GitHub</a> — MIT</span>
</footer>
</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var DAY=864e5;
function pd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dd(a,b){return Math.round((pd(b)-pd(a))/DAY);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmt(s){var p=String(s).split("-");return +p[1]+"/"+ +p[2];}

var ST={fixed:{l:"確定",c:"fixed"},active:{l:"作業中",c:"active"},
        prov:{l:"仮置き",c:"prov"},stall:{l:"停止中",c:"stall"}};

/* ===== サンプルデータ（架空のチーム）===== */
var els=[
{id:"spd",n:"設計飛行速度",g:"全体設計",v:"8.0 m/s",st:"prov",since:"2026-08-04",deps:[],
 rev:"風況の想定を見直すとき／機体抗力が確定したとき",
 note:"対気速度。向かい風を想定し、高速機にしてスパンを短くする狙い。",
 src:{ch:"#相談・質問（プロペラ班）",d:"2026-08-04",q:"では、機体速度8.0m/s 推力22Nで進めます。"}},

{id:"re",n:"レイノルズ数",g:"翼班",v:"現地・代表長さ1m で算出",st:"active",since:"2026-08-20",deps:["spd"],
 note:"気象データから算出するシートを自作。",
 src:{ch:"#翼班",d:"2026-08-20",q:"気象データをもとに現地のレイノルズ数を算出するシートを作りました。"}},

{id:"foil",n:"翼型",g:"全体設計",v:"候補2種を比較中",st:"active",since:"2026-08-21",deps:["re"],
 note:"片方は製作が容易、もう片方は低Re向け。揚抗比で比較中。",
 src:{ch:"#翼班",d:"2026-08-20",q:"候補が2種類出てきました。片方は製作が楽なので迷っています。"}},

{id:"area",n:"翼面積",g:"翼班",v:"候補翼型の最適揚抗比から算出済",st:"active",since:"2026-08-21",deps:["foil"],
 note:"タンデム機のため、前後翼の合計面積で見る。",
 src:{ch:"#翼班",d:"2026-08-21",q:"候補の一方で最適な揚抗比が出たので翼面積も出ました。"}},

{id:"lift",n:"揚力分布・揚力分担",g:"翼班",v:"再計算中（前回値に誤り）",st:"stall",since:"2026-08-07",deps:["area"],
 note:"8/5に誤りが判明。「期間は数日かと」と報告されたまま止まっている。タンデム機なので揚力分担が必須。",
 src:{ch:"#翼班",d:"2026-08-05",q:"前回出した揚力分布、翼面積などの数値に誤りがあり大幅な修正が必要、その対応中。"}},

{id:"drag",n:"機体抗力",g:"翼班",v:"算出中",st:"stall",since:"2026-08-07",deps:["area","foil"],
 note:"プロペラ班の吸収出力がこの値を待っている。8/7以降、進捗の報告なし。",
 src:{ch:"#翼班",d:"2026-08-07",q:"次のタスク：揚力分布再計算、抗力算出、尾翼系設計、主翼解析"}},

{id:"cg",n:"重心位置",g:"全体設計",v:"未算出",st:"stall",since:"2026-08-04",deps:["lift"],
 note:"「揚力分担をしたということはモーメント的に適した重心位置が出せる」との指摘に「出します」と回答したまま。",
 src:{ch:"#相談・質問（翼班）",d:"2026-08-04",q:"重心位置を出します。尾部アームは5〜6mくらいがよさそうだと個人的には思っています。"}},

{id:"tail",n:"尾部アーム長",g:"全体設計",v:"5〜6 m 見込み",st:"prov",since:"2026-08-04",deps:["cg"],
 rev:"重心位置が確定したとき",
 note:"班長の個人見解として出た数字。根拠となる重心位置がまだ無い。",
 src:{ch:"#相談・質問（翼班）",d:"2026-08-04",q:"尾部アームの長さを決めたほうがやりやすいので決めたいのだけど。"}},

{id:"emp",n:"尾翼系設計",g:"翼班",v:"未着手（担当のみ決定）",st:"stall",since:"2026-08-05",deps:["tail"],
 note:"担当者は決定済み。尾部アーム長の確定待ち。",
 src:{ch:"#翼班",d:"2026-08-05",q:"尾翼の設計担当を決定しました。"}},

{id:"sparW",n:"主桁 計算",g:"フレーム班",v:"試算を始めた段階",st:"active",since:"2026-08-24",deps:["lift"],
 note:"荷重条件シートを翼班長から口頭で受け取って進めている。計算順は 主桁→中央桁→胴体桁。",
 src:{ch:"#フレーム班",d:"2026-08-24",q:"いま出ているシートで試しに計算してみようという段階です。"}},

{id:"sparC",n:"中央桁 計算",g:"フレーム班",v:"未着手",st:"stall",since:"2026-08-24",deps:["sparW"],
 note:"力学的な依存があるため主桁の計算後。",
 src:{ch:"#フレーム班",d:"2026-08-24",q:"主桁の計算後、中央桁 → 胴体桁 の順で進めると考えられます。"}},

{id:"sparB",n:"胴体桁 計算",g:"フレーム班",v:"未着手",st:"stall",since:"2026-08-24",deps:["sparC"],
 note:"中央桁の計算後。",
 src:{ch:"#フレーム班",d:"2026-08-24",q:"主桁の計算後、中央桁 → 胴体桁 の順で進めると考えられます。"}},

{id:"pipe",n:"胴体桁 寸法",g:"フレーム班",v:"Φ100 / Φ110（内径）肉厚2mm",st:"fixed",since:"2026-02-10",deps:[],
 note:"2本構成。駆動系を通すのは Φ110 の方。",
 src:{ch:"#フレーム班",d:"2026-02-10",q:"2本あってΦ100とΦ110（内径）。駆動を通す方は後者です。肉厚2mm。"}},

{id:"pose",n:"搭乗姿勢",g:"フレーム班",v:"計測済",st:"fixed",since:"2026-08-05",deps:[],
 note:"現地で姿勢を決定し縦横高さを計測。前例のない姿勢のため他チームの設計は参考にならない。",
 src:{ch:"#フレーム班",d:"2026-08-05",q:"現地で姿勢決定と寸法計測を行い、モックアップ設計の準備を進めます。"}},

{id:"saddle",n:"シート成形方法",g:"フレーム班",v:"3案を比較中",st:"active",since:"2026-08-04",deps:["pose"],
 note:"決まらないとモックアップ設計に進めない。",
 src:{ch:"#フレーム班",d:"2026-08-04",q:"シートの型を取る成形方法を調べてくるよう指示。"}},

{id:"pow",n:"プロペラ吸収出力",g:"プロペラ班",v:"200 W",st:"prov",since:"2026-08-04",deps:["drag"],
 rev:"機体抗力が確定したら再計算する（※ログ上に見直し条件の記録なし）",
 note:"抗力が出ないと本来決められないが、製作期間の都合で仮置きした。下がる分は軽くなるので可、上がるとトレーニングが厳しい、という判断。",
 src:{ch:"#相談・質問（プロペラ班）",d:"2026-08-04",q:"他班の抗力が出ないと推力が出せません。でも製作期間的に待ってられないと思うのですがどうしますか？"}},

{id:"prop",n:"プロペラ径・回転数",g:"プロペラ班",v:"1.8m→96rpm / 1.6m→118rpm",st:"prov",since:"2026-08-20",deps:["pow"],
 rev:"吸収出力が確定したとき／径を1本に決めたとき",
 note:"2案が並走したまま。1.6m は効率がわずかに落ちる。",
 src:{ch:"#プロペラ班",d:"2026-08-20",q:"サイズが短くなったぶん必要な回転数が増えました。最効率は118rpmです。"}},

{id:"pmake",n:"プロペラ製法",g:"プロペラ班",v:"木材削り出し＋塗膜",st:"fixed",since:"2026-08-11",deps:[],
 note:"アドバイザーの助言を受けて決定。桁計算の結果が厳しければ別材質へ移行する条件つき。",
 src:{ch:"#プロペラ班",d:"2026-08-11",q:"図面を完成させるという目標を考慮し、木材削り出し＋塗膜による表面硬化を本命として進めます。"}},

{id:"shaft",n:"入力軸の軸径",g:"駆動班",v:"20 mm（再検討の指摘あり）",st:"stall",since:"2026-08-04",deps:[],
 note:"合う歯車が無く20mmに決め直したが、同日にアドバイザーから「かなり太い」と指摘。以降この件への回答が記録にない。",
 src:{ch:"#駆動班",d:"2026-08-04",q:"その出力を伝達する、しかも回転速度も低いベベルギアの軸径20mmは、私の経験的感覚からするとかなり太い。"}},

{id:"gear",n:"ギア比・歯数比",g:"駆動班",v:"設計中（2案に両対応）",st:"active",since:"2026-08-20",deps:["prop"],

var liveGroups={};   /* 班名 → その班の最終投稿日（サーバー or log.txt から） */
/** その要素の担当班に、記録より新しい投稿があるか */
function groupFresh(e){ var d=liveGroups[e.g]; return (d && pd(d)>pd(e.since)) ? d : null; }

/* ---- 派生 ---- */
function ups(id){return (byId[id].deps||[]).filter(function(x){return byId[x];});}
function downs(id){return els.filter(function(e){return (e.deps||[]).indexOf(id)>=0;}).map(function(e){return e.id;});}
function allDowns(id){
  var out=[],st=downs(id),seen={};
  while(st.length){var c=st.pop(); if(seen[c])continue; seen[c]=1; out.push(c); downs(c).forEach(function(x){st.push(x);});}
  return out;
}
/** 上流が自分より後に動いていたら「再確認が必要」。
    停止中の上流は除く（止まっている＝新しい値が出ていない、ため）。 */
function staleBy(id){
  return ups(id).filter(function(u){
    return byId[u].st!=="stall" && pd(byId[u].since)>pd(byId[id].since);
  });
}
/** 上流が止まっていて自分も進めない状態 */
function blockedBy(id){
  return ups(id).filter(function(u){return byId[u].st==="stall";});
}
function blockers(){
  return els.filter(function(e){return e.st==="stall" && downs(e.id).length>0;})
            .sort(function(a,b){return allDowns(b.id).length-allDowns(a.id).length;});
}
function depth(id,seen){
  seen=seen||{};
  if(seen[id])return 0; seen[id]=1;
  var u=ups(id); if(!u.length)return 0;
  return Math.max.apply(null,u.map(function(x){return depth(x,Object.assign({},seen));}))+1;
}

/* ---- 依存グラフ（自動レイアウト）---- */
function renderDep(){
  var lay={},maxD=0;
  els.forEach(function(e){var d=depth(e.id); lay[e.id]=d; if(d>maxD)maxD=d;});
  var cols=[];
  for(var i=0;i<=maxD;i++)cols.push([]);
  els.forEach(function(e){cols[lay[e.id]].push(e);});

  var NW=152,NH=42,GX=196,GY=56,PAD=16;
  var maxRows=Math.max.apply(null,cols.map(function(c){return c.length;}));
  var W=PAD*2+maxD*GX+NW, H=PAD*2+(maxRows-1)*GY+NH;
  var pos={};
  cols.forEach(function(col,ci){
    var off=(maxRows-col.length)/2;
    col.forEach(function(e,ri){ pos[e.id]={x:PAD+ci*GX, y:PAD+(ri+off)*GY}; });
  });

  var s='<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--rule-2)"/></marker></defs>';
  els.forEach(function(e){
    ups(e.id).forEach(function(u){
      var a=pos[u],b=pos[e.id];
      var x1=a.x+NW,y1=a.y+NH/2,x2=b.x-7,y2=b.y+NH/2,mx=(x1+x2)/2;
      var hot=(e.id===sel||u===sel);
      s+='<path d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" fill="none" stroke="'
        +(hot?"var(--ink)":"var(--rule-2)")+'" stroke-width="'+(hot?2:1.4)+'" marker-end="url(#a)"/>';
    });
  });
  els.forEach(function(e){
    var p=pos[e.id],c="var(--"+ST[e.st].c+")",bg="var(--"+ST[e.st].c+"-bg)";
    var st=staleBy(e.id).length, on=(e.id===sel);
    s+='<g class="g-node" data-id="'+e.id+'">'
      +'<rect x="'+p.x+'" y="'+p.y+'" width="'+NW+'" height="'+NH+'" rx="4" fill="'+bg+'" stroke="'+c
      +'" stroke-width="'+(on?3:1.4)+'"/>'
      +'<rect x="'+p.x+'" y="'+p.y+'" width="3.5" height="'+NH+'" rx="2" fill="'+c+'"/>'
      +'<text x="'+(p.x+11)+'" y="'+(p.y+17)+'" font-size="12" font-weight="700" fill="var(--ink)" font-family="Zen Kaku Gothic New,sans-serif">'+esc(e.n.slice(0,11))+'</text>'
      +'<text x="'+(p.x+11)+'" y="'+(p.y+32)+'" font-size="10.5" fill="var(--muted)" font-family="Zen Kaku Gothic New,sans-serif">'+esc(e.g)+'</text>'
      +(st?'<circle cx="'+(p.x+NW-11)+'" cy="'+(p.y+11)+'" r="6.5" fill="var(--stall)"/><text x="'+(p.x+NW-11)+'" y="'+(p.y+15)+'" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Roboto Mono,monospace">!</text>':"")
      +'</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:'+W+'px;max-width:none">'+s+'</svg>';
}

  if(!dn.length) h+='<span class="none">直接の下流はありません</span>';
  else h+='<div class="chain">'+dn.map(function(d){
    return '<a data-id="'+d+'"><span class="badge b-'+ST[byId[d].st].c+'">'+ST[byId[d].st].l+'</span>'
      +'<span>'+esc(byId[d].n)+'</span><span class="g">'+esc(byId[d].g)+'</span></a>';
  }).join("")+'</div>'
   +(ad.length>dn.length?'<div class="sub" style="margin-top:5px">さらに先まで含めると <b>'+ad.length+'要素</b>に波及します</div>':"");
  h+='</dd>';

  h+='<dt>この値が必要としている上流</dt><dd>';
  var u=ups(sel);
  if(!u.length) h+='<span class="none">上流はありません（起点）</span>';

  var tab=t.closest&&t.closest("[role=tab]");

  var node=t.closest&&(t.closest(".g-node")||t.closest("tr[data-id]")||t.closest(".chain a"));
  if(node&&node.getAttribute("data-id")){ sel=node.getAttribute("data-id"); renderAll(); return; }
  var cp=t.closest&&t.closest("button[data-copy]");
  if(cp){
    var i=cp.getAttribute("data-copy"),ok=$("ok"+i);
    function done(m){ok.textContent=m;setTimeout(function(){ok.textContent="";},2400);}
    function fb(){try{var r=document.createRange();r.selectNodeContents($("tb"+i));
      var s2=window.getSelection();s2.removeAllRanges();s2.addRange(r);done("選択→Ctrl+C");}catch(x){done("手動でコピーを");}}

      navigator.clipboard.writeText(tasks[+i].b).then(function(){done("コピーしました");}).catch(fb); else fb();
    }catch(x){fb();}
  }
});

}
$("base").addEventListener("change",function(){base=this.value||"2026-08-26";renderAll();});
$("today").addEventListener("click",function(){
  var n=new Date(),s=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
  $("base").value=s;base=s;renderAll();
});

/* ---- ライブ接続 ----
   ① /api/stream （server.mjs）→ 投稿された瞬間に受信
   ② log.txt を10秒ごと（静的ホスティング）
   どちらも取れなければ静的表示のまま                               */
(function(){
  var stat=$("pollStat"), es=null, timer=null, lastSig="";
  function set(t,c){ stat.textContent=t; stat.className="pollstat "+(c||""); }
  function apply(map){
    var ch=false;
    Object.keys(map||{}).forEach(function(g){
      if(!liveGroups[g] || pd(map[g])>pd(liveGroups[g])){ liveGroups[g]=map[g]; ch=true; }
    });
    if(ch) renderAll();
    return ch;
  }
  /** 「YYYY-MM-DD 役職 [班名]」の行から 班→最終日 を作る */
  var SPLITTER=new RegExp(String.fromCharCode(91,92,114,92,110,93)+String.fromCharCode(43));
  function parseLog(txt){
    var re=/^\s*(\d{4}-\d{2}-\d{2})\s+(\S+)(?:\s+\[([^\]]+)\])?/, map={};
    txt.split(SPLITTER).forEach(function(line){
      var m=line.match(re); if(!m) return;
      var g=m[3];
      if(!g){  /* ラベルが無ければ役職名から班を推測 */
        for(var i=0;i<GROUPS.length;i++) if(m[2].indexOf(GROUPS[i])===0){ g=GROUPS[i]; break; }
      }
      if(!g) return;
      if(!map[g] || pd(m[1])>pd(map[g])) map[g]=m[1];
    });
    return map;
  }
  function startPoll(){
    function tick(){
      fetch("log.txt",{cache:"no-store"}).then(function(r){
        if(!r.ok) throw 0; return r.text();
      }).then(function(t){
        var sig=t.length+":"+t.slice(-120);
        var now=new Date().toTimeString().slice(0,8);
        if(sig!==lastSig){ lastSig=sig; apply(parseLog(t)); }
        set("● データ元に接続 "+now,"live");
      }).catch(function(){ set("静的表示（データ元なし）",""); clearInterval(timer); });
    }
    tick(); timer=setInterval(tick,10000);
  }
  if(typeof EventSource==="undefined"){ startPoll(); return; }
  try{ es=new EventSource("/api/stream"); }catch(e){ startPoll(); return; }
  var opened=false;
  es.onopen=function(){ opened=true; set("● Discord接続中（即時反映）","live"); };
  es.onmessage=function(ev){
    var st; try{ st=JSON.parse(ev.data); }catch(e){ return; }
    var now=new Date().toTimeString().slice(0,8);
    apply(st.groups||{});
    set((st.connected?"● Discord接続中 ":"○ Discord切断中 ")+now, st.connected?"live":"off");
  };
  es.onerror=function(){
    es.close(); es=null;
    if(!opened) startPoll();
    else { set("○ 接続が切れました。再接続します","off"); setTimeout(function(){location.reload();},8000); }
  };
})();

renderAll();
})();
</script>
